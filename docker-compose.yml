services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: receptfeed
      POSTGRES_USER: receptfeed
      POSTGRES_PASSWORD: receptfeed
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receptfeed -d receptfeed"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: receptfeed
      DB_USERNAME: receptfeed
      DB_PASSWORD: receptfeed
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the built JS at image-build time, not read at container
        # startup - it must be an address the BROWSER can reach, so the
        # backend's host-published port, not the internal Docker network name.
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
