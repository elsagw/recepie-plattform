spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:receptfeed}
    username: ${DB_USERNAME:receptfeed}
    password: ${DB_PASSWORD:receptfeed}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          # Defaults let the app start/build without real credentials (e.g. tests, CI).
          # Real Google login requires GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET in .env.
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: openid,email,profile

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
