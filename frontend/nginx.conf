server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode (real-looking URLs like /feed, not #/feed) -
    # any path that isn't a real file falls back to index.html so the client-side
    # router can take over, instead of nginx 404ing on a direct reload/deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
